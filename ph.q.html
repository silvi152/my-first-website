<html lang="bn">
<head>

  body{font-family:Arial, sans-serif; background: #e3f2fd; padding:12px; max-width:620px; margin:auto;}

  padding: 8px 12px; 
  border-radius: 20px; 
  cursor: pointer; 
  font-weight: bold; 
  transition: 0.2s; 
}


  .set-btn.active, .set-btn:hover { background: #4169E1; color: white; border-color: #e65100; }
  
  .card{background:white; padding:14px; border-radius:12px; margin:12px 0; box-shadow:6 2px 8px rgba(0,0,0,.1);}
  button.opt{width:100%; padding:11px; margin:5px 0; border:1px solid #ddd; border-radius:8px; background:#fff3e0; text-align:left; font-size:15px; cursor: pointer; transition: 0.2s;}
  button.opt:hover{background: #ffe0b2;}
  button.opt.correct{background:#c8e6c9!important; border-color:green; color: #1b5e20; font-weight: bold;}
  button.opt.wrong{background:#ffcdd2!important; border-color:red; color: #b71c1c;}
  
  #top {
  display: flex; 
  justify-content: space-between; 
  align-items: center;
  font-weight: bold; 
  font-size: 14px;
  position: sticky; 
  top: 0;

  padding: 12px 15px; /* চারদিকে পর্যাপ্ত জায়গা দেওয়া হলো যেন লেখা বাইরে না যায় */
  margin: 10px 0;
  border-radius: 10px; /* স্কোরবোর্ডটিকে একটি সুন্দর আলাদা বক্সে রূপান্তর করা হলো */

  z-index: 100; /* যেন স্ক্রোল করার সময় এটি সবসময় সবার উপরে ভেসে থাকে */
  color: #2e7d32;
}

  #barWrap{height:10px; background:#ddd; border-radius:5px; overflow:hidden; margin:5px 0 15px;}
  #bar{height:100%; background:#e65100; width:0%; transition:0.3s;}
  #nextBtn{width:100%; padding:14px; background:#e65100; color:white; border:none; border-radius:10px; font-size:18px; margin:15px 0; display:none; cursor: pointer;}
 </style>
</head>
<body>
   <h1>⚛️ Physics Special Quiz</h1>
   
   <div class="set-container">
        <p>আপনার পছন্দের কুইজ সেট সিলেক্ট করুন:</p>

            <button id="btnSet5" class="set-btn" onclick="changeSet(4)">সেট 5 (61-75)</button>
            <button id="btnSet6" class="set-btn" onclick="changeSet(5)">সেট 6 (76-90)</button>

   <script>
    const allQuestions = [
     
     {q:"বলের একক কি?", o:["Joule","Newton","Watt","Pascal"], a:1},
     {q:"কাজের একক কি?", o:["Joule","Newton","Watt","Volt"], a:0},
     {q:"ক্ষমতার একক কি?", o:["Joule","Newton","Watt","Ampere"], a:2},
     {q:"পদার্থবিজ্ঞানে বেগের সঠিক মাত্রা সমীকরণ কোনটি?", o:["LT⁻¹","LT⁻²","LT","L/T²"], a:0},
     {q:"আন্তর্জাতিক পদ্ধতিতে ত্বরণের একক কোনটি?", o:["m/s","m/s²","m²/s","N (Newton)"], a:1},

     {q:"কোনো গতিশীল বস্তুর ভরবেগ (p) নির্ণয়ের সঠিক সূত্র কোনটি?", o:["p = mv","p = ma","p = mgh","p = 1/2 mv²"], a:0},
     {q:"কোনো গতিশীল বস্তুর গতিশক্তি (Kinetic Energy) বের করার সমীকরণ কোনটি?", o:["mgh","1/2 mv²","mv","ma"], a:1},
     {q:"কোনো বস্তুকে ভূপৃষ্ঠ থেকে উপরে তুললে তার বিভব শক্তি (Potential Energy) কত হবে?", o:["mgh","1/2 mv²","mv","Fs"], a:0},
     {q:"ভূপৃষ্ঠে অভিকর্ষজ ত্বরণ 'g' এর আদর্শ মান কত ধরা হয়?", o:["৯.৮ m/s²","১০ m/s²","৮.৯ m/s²","৯.৮ m/s"], a:0},
     {q:"পৃথিবী থেকে কোনো বস্তুর মুক্তিবেগের (Escape Velocity) মান কত?", o:["১১.২ km/s","৯.৮ km/s","৭.৯ km/s","১৫ km/s"], a:0},
     {q:"মহাকর্ষীয় ধ্রুবক 'G' এর সঠিক মান কোনটি?", o:["6.67 × 10⁻¹¹ N m²/kg²","৯.৮ m/s²","3 × 10⁸ m/s","1.6 × 10⁻¹⁹ C"], a:0},
     {q:"শূন্য মাধ্যমে আলোর বেগ 'c' এর মান কত?", o:["3 × 10⁸ m/s","3 × 10⁶ m/s","3 × 10¹⁰ m/s","৯.৮ m/s"], a:0},
     {q:"স্বাভাবিক তাপমাত্রায় বাতাসে শব্দের বেগ কত হয়ে থাকে?", o:["৩৩২ m/s","৩০০ m/s","3 × 10⁸ m/s","১৫০০ m/s"], a:0},
     {q:"তরঙ্গের ফ্রিকোয়েন্সি বা কম্পাঙ্কের আন্তর্জাতিক একক কী?", o:["হার্টজ (Hz)","মিটার (m)","সেকেন্ড (s)","জুল (J)"], a:0},
     {q:"পদার্থবিজ্ঞানে তরঙ্গদৈর্ঘ্যের (Wavelength) একক কোনটি?", o:["হার্টজ (Hz)","মিটার (Meter)","সেকেন্ড (Second)","জুল (Joule)"], a:1},
     {q:"তড়িৎ চালক শক্তি, কারেন্ট ও রোধের মধ্যে ওহমের সঠিক সূত্র কোনটি?", o:["V = IR","F = ma","P = VI","E = mc²"], a:0},
     {q:"সার্কিটে তড়িৎ প্রবাহের বাধার একক বা রোধের একক কী?", o:["ওহম (Ohm)","অ্যাম্পিয়ার (Ampere)","ভোল্ট (Volt)","ওয়াট (Watt)"], a:0},
     {q:"বৈদ্যুতিক সার্কিটে কারেন্ট বা বিদ্যুৎ প্রবাহের একক কোনটি?", o:["ওহম (Ohm)","অ্যাম্পিয়ার (Ampere)","ভোল্ট (Volt)","জুল (Joule)"], a:1},
     {q:"বৈদ্যুতিক বিভব পার্থক্য বা ভোল্টেজের একক কী?", o:["ভোল্ট (Volt)","অ্যাম্পিয়ার (Ampere)","ওহম (Ohm)","ওয়াট (Watt)"], a:0},
     {q:"তড়িৎ ক্ষমতার সমীকরণ 'P = VI' দ্বারা মূলত কী পরিমাপ করা হয়?", o:["ক্ষমতা (Power)","বল (Force)","শক্তি (Energy)","আধান (Charge)"], a:0},
     {q:"বিখ্যাত ভর-শক্তি সমীকরণ 'E = mc²' সূত্রটি কার?", o:["স্যার আইজ্যাক নিউটন","আলবার্ট আইনস্টাইন","জর্জ সাইমন ওহম","মাইকেল ফ্যারাডে"], a:1},
     {q:"একটি ইলেকট্রনের আধান বা চার্জের পরিমাণ কত?", o:["1.6 × 10⁻¹⁹ C","1.6 × 10¹⁹ C","9.1 × 10⁻³¹ C","6.67 × 10⁻¹¹ C"], a:0},
     {q:"একটি প্রোটনের প্রকৃত ভর নিচের কোনটি?", o:["9.1 × 10⁻³¹ kg","1.67 × 10⁻²৭ kg","1.6 × 10⁻¹⁹ kg","৯.৮ kg"], a:1},
     {q:"চশমার লেন্সের ক্ষমতার আন্তর্জাতিক একক কী?", o:["মিটার (Meter)","ডায়োপ্টার (Diopter)","ওয়াট (Watt)","জুল (Joule)"], a:1},
     {q:"লেন্সের ফোকাস দূরত্ব (f) ও ক্ষমতার (P) মধ্যকার সঠিক সম্পর্ক কোনটি?", o:["f = 1/P","f = P²","f = 1/P²","f = P"], a:0},
     {q:"আলোকরশ্মির ক্ষেত্রে উত্তল লেন্স মূলত কী কাজ করে?", o:["আলোকরশ্মি অভিসারী করা","আলোকরশ্মি অপসারী করা","আলোর সাধারণ প্রতিফলন","কোনো পরিবর্তন করে না"], a:0},
     {q:"আলোকরশ্মির ক্ষেত্রে অবতল লেন্সের প্রধান কাজ কোনটি?", o:["আলোকরশ্মি অভিসারী করা","আলোকরশ্মি অপসারী করা","আলোর প্রতিফলন ঘটানো","আলোর বিচ্ছুরণ ঘটানো"], a:1},
     {q:"প্রতিসরাঙ্ক (n) নির্ণয়ের সঠিক সূত্র কোনটি?", o:["n = c/v","n = v/c","n = c × v","n = c + v"], a:0},
     {q:"নিচের কোনটি আলোর প্রতিসরণের স্নেলের সূত্র?", o:["n₁ sinθ₁ = n₂ sinθ₂","V = IR","F = ma","E = mc²"], a:0},
     {q:"পানির পরম প্রতিসরাঙ্ক কত?", o:["১.০০","১.৩৩","১.৫০","২.৪২"], a:1},
     {q:"সাধারণ কাচের প্রতিসরাঙ্ক কত হয়ে থাকে?", o:["১.৩৩","১.৫০","১.০০","২.০০"], a:1},
     {q:"হীরার প্রতিসরাঙ্ক নিচের কোনটি?", o:["১.৫০","২.৪২","১.৩৩","১.০০"], a:1},
     {q:"পদার্থবিজ্ঞানে চাপের আন্তর্জাতিক (SI) একক কি?", o:["প্যাসকেল (Pascal)","নিউটন (Newton)","জুল (Joule)","ওয়াট (Watt)"], a:0},

     {q:"আর্কিমিডিসের সূত্রটি নিচের কোনটির সাথে সম্পর্কিত?", o:["তরলের প্লবতা","মহাকর্ষ বল","স্থির তড়িৎ","আলোর প্রতিফলন"], a:0},

     {q:"পরম শূন্য তাপমাত্রা বা ০ K সমান কত সেলসিয়াস?", o:["০° C","-২৭৩° C","২৭৩° C","১০০° C"], a:1},

   let currentSet = 0, totalScore = 0, totalAnswered = 0;
    const perPage = 15;

    // সেট বাটনে ক্লিক করলে কাজ করার ফাংশন
    function changeSet(setNumber) {
        currentSet = setNumber;
        
        // সব বাটন থেকে active ক্লাস রিমুভ করে নির্দিষ্ট বাটনে অ্যাড করা
        let buttons = document.querySelectorAll('.set-btn');
        buttons.forEach((b, idx) => {
            if(idx === setNumber) b.classList.add('active');
            else b.classList.remove('active');
        });

        window.scrollTo(0, 0);
        loadSet();
    }

    // নির্দিষ্ট সেটের প্রশ্ন পর্দায় দেখানোর ফাংশন
    function loadSet() {
        const quizDiv = document.getElementById('quiz'); 
        quizDiv.innerHTML = '';
        document.getElementById('nextBtn').style.display = 'none';
      
        let start = currentSet * perPage; 
        let end = Math.min(start + perPage, allQuestions.length);
      
        // যদি ওই সেটে কোনো প্রশ্নই না থাকে
        if (start >= allQuestions.length) {
            quizDiv.innerHTML = `<div class='card' style='text-align:center; color:red;'>এই সেটে এখনও কোনো প্রশ্ন যোগ করা হয়নি!</div>`;
            document.getElementById('pageInfo').innerText = `Set ${currentSet + 1} (০-০ / ${allQuestions.length})`;
            return;
        }

        document.getElementById('pageInfo').innerText = `Set ${currentSet + 1} (${start + 1}-${end} / ${allQuestions.length})`;
      
        for (let i = start; i < end; i++) {
            const q = allQuestions[i]; 
            const card = document.createElement('div'); 
            card.className = 'card';
            card.innerHTML = `<b>${i + 1}. ${q.q}</b>`;
        
            q.o.forEach((opt, idx) => {
                const btn = document.createElement('button'); 
                btn.className = 'opt';
                btn.innerText = `${['A', 'B', 'C', 'D'][idx]}. ${opt}`;
          
                btn.onclick = () => {
                    if (card.dataset.done) return; 
                    card.dataset.done = 1;
            
                    if (idx === q.a) {
                        btn.classList.add('correct'); 
                        totalScore++;
                    } else {
                        btn.classList.add('wrong'); 
                        card.querySelectorAll('.opt')[q.a].classList.add('correct');
                    }
            
                    totalAnswered++; 
                    document.getElementById('scoreInfo').innerText = `Score: ${totalScore}/${totalAnswered}`;
                    
                    // প্রোগ্রেস বার আপডেট
                    document.getElementById('bar').style.width = (totalAnswered / allQuestions.length * 100) + '%';
            
                    // বর্তমান সেটের সবগুলো উত্তর দেওয়া শেষ হলে
                    if (document.querySelectorAll('.card[data-done]').length === (end - start)) {
                        let nextStart = (currentSet + 1) * perPage;
                        if (nextStart < allQuestions.length) {
                            document.getElementById('nextBtn').style.display = 'block';
                        } else {
                            document.getElementById('nextBtn').style.display = 'none';
                            quizDiv.innerHTML += `<div class='card' style='text-align:center; color:green; font-weight:bold;'>🎉 কুইজ সম্পূর্ণ হয়েছে! আপনার মোট স্কোর: ${totalScore}/${allQuestions.length} (${Math.round(totalScore/allQuestions.length*100)}%)</div>`;
                        }
                    }
                }; 
                card.appendChild(btn);
            }); 
            quizDiv.appendChild(card);
        }
    }

    // পরের সেটে যাওয়ার ফাংশন
    function nextSet() {
        currentSet++; 
        changeSet(currentSet);
    }

    // প্রথমবার পেজ লোড হওয়ার সময় কুইজ চালু করা
    loadSet();
  </script>
</body>
</html>

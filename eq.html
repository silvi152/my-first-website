<!DOCTYPE html>

<style>
body{font-family:Arial, sans-serif; background:#e8f5e9; padding:12px; max-width:620px; margin:auto;}
h1{text-align:center; color:#2e7d32; margin-bottom: 5px;}

/* সেট সিলেকশন এরিয়া */
.set-container { background: white; padding: 12px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.1); text-align: center; }
.set-container p { margin: 0 0 10px 0; font-weight: bold; color: #444; }
.btn-group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.set-btn { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
.set-btn.active, .set-btn:hover { background: #2e7d32; color: white; border-color: #2e7d32; }

/* কুইজ কার্ড ও অপশন বাটন */
.card{background:white; padding:14px; border-radius:12px; margin:12px 0; box-shadow:0 2px 8px rgba(0,0,0,.1);}
button.opt{width:100%; padding:11px; margin:5px 0; border:1px solid #ddd; border-radius:8px; background:#f1f8e9; text-align:left; font-size:15px; cursor: pointer; transition: 0.2s;}
button.opt:hover{background: #e8f5e9;}
button.opt.correct{background:#c8e6c9!important; border-color:green; color: #1b5e20; font-weight: bold;}
button.opt.wrong{background:#ffcdd2!important; border-color:red; color: #b71c1c;}

/* স্কোর ও প্রোগ্রেস বার */
#top{display:flex; justify-content:space-between; font-weight:bold; position:sticky; top:0; background:#e8f5e9; padding:8px 0; z-index:10;}
#barWrap{height:10px; background:#ddd; border-radius:5px; overflow:hidden; margin:5px 0 15px;}
#bar{height:100%; background:#2e7d32; width:0%; transition:0.3s;}
#nextBtn{width:100%; padding:14px; background:#2e7d32; color:white; border:none; border-radius:10px; font-size:18px; margin:15px 0; display:none; cursor: pointer;}
</style>

  let currentSet = 0, totalScore = 0, totalAnswered = 0;
  const perPage = 15;

  function changeSet(setNumber) {
    currentSet = setNumber;
    let buttons = document.querySelectorAll('.set-btn');
    buttons.forEach((b, idx) => {
        if(idx === setNumber) b.classList.add('active');
        else b.classList.remove('active');
    });
    window.scrollTo(0,0); 
    loadSet();
  }

  function loadSet() {
    const quizDiv = document.getElementById('quiz'); 
    quizDiv.innerHTML = '';
    document.getElementById('nextBtn').style.display = 'none';
    
    let start = currentSet * perPage; 
    let end = Math.min(start + perPage, allQuestions.length);
    
    if (start >= allQuestions.length) {
        quizDiv.innerHTML = `<div class='card' style='text-align:center; color:red;'>এই সেটে কোনো প্রশ্ন যোগ করা হয়নি!</div>`;
        document.getElementById('pageInfo').innerText = `Set ${currentSet + 1} (0-0 / ${allQuestions.length})`;
        return;
    }

    document.getElementById('pageInfo').innerText = `Set ${currentSet + 1} (${start + 1}-${end} / ${allQuestions.length})`;
    
    for (let i = start; i < end; i++) {
      const q = allQuestions[i]; 
      const card = document.createElement('div'); 
      card.className = 'card';
      card.innerHTML = `<b>${i + 1}. ${q.q}</b>`;
      
      q.o.forEach((opt, idx) => {
        const btn = document.createElement('button'); 
        btn.className = 'opt';
        btn.innerText = `${['A', 'B', 'C', 'D'][idx]}. ${opt}`;
        
        btn.onclick = () => {
          if (card.dataset.done) return; 
          card.dataset.done = 1;
          
          if (idx === q.a) {
            btn.classList.add('correct'); 
            totalScore++;
          } else {
            btn.classList.add('wrong'); 
            card.querySelectorAll('.opt')[q.a].classList.add('correct');
          }
          
          totalAnswered++; 
          document.getElementById('scoreInfo').innerText = `Score: ${totalScore}/${totalAnswered}`;
          document.getElementById('bar').style.width = (totalAnswered / allQuestions.length * 100) + '%';
          
          if (document.querySelectorAll('.card[data-done]').length === (end - start)) {
            let nextStart = (currentSet + 1) * perPage;
            if (nextStart < allQuestions.length) {
              document.getElementById('nextBtn').style.display = 'block';
            } else {
              document.getElementById('nextBtn').style.display = 'none';
              
              const resultCard = document.createElement('div');
              resultCard.className = 'card';
              resultCard.style.cssText = 'text-align:center; color:green; font-weight:bold; margin-top:20px;';
              resultCard.innerHTML = `🎉 Done! Final Score: ${totalScore}/${allQuestions.length} (${Math.round(totalScore/allQuestions.length*100)}%)`;
              quizDiv.appendChild(resultCard);
            }
          }
        };
        card.appendChild(btn);
      });
      quizDiv.appendChild(card);
    }
  }

  function nextSet() {
    currentSet++; 
    changeSet(currentSet);
  }

  loadSet();

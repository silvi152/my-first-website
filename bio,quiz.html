<!DOCTYPE html>
<html lang="bn">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Biology Special Quiz</title>
 <style>
  body{font-family:Arial, sans-serif; background: #e3f2fd; padding:12px; max-width:620px; margin:auto;}
  h1{text-align:center; color:#4169E1; margin-bottom: 5px;}
  
  /* সেট কন্টেইনার ও বাটনের সুন্দর ডিজাইন */
  .set-container { background: white; padding: 12px; border-radius: 12px; margin-bottom: 15px; box-shadow: 2 2px 8px rgba(0,0,0,.1); text-align: center; }
  .set-container p { margin: 0 0 10px 0; font-weight: bold; color: #555; }
  .btn-group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .set-btn { 
  background: #e3f2fd; /* হালকা কমলার বদলে হালকা নীল */
  color: #0d47a1;     /* লেখার রঙ গাঢ় নীল */
  border: 1px solid #90caf9; 
  padding: 8px 12px; 
  border-radius: 20px; 
  cursor: pointer; 
  font-weight: bold; 
  transition: 0.2s; 
}


  .set-btn.active, .set-btn:hover { background: #4169E1; color: white; border-color: #e65100; }
  
  .card{background:white; padding:14px; border-radius:12px; margin:12px 0; box-shadow:6 2px 8px rgba(0,0,0,.1);}
  button.opt{width:100%; padding:11px; margin:5px 0; border:1px solid #ddd; border-radius:8px; background:#fff3e0; text-align:left; font-size:15px; cursor: pointer; transition: 0.2s;}
  button.opt:hover{background: #ffe0b2;}
  button.opt.correct{background:#c8e6c9!important; border-color:green; color: #1b5e20; font-weight: bold;}
  button.opt.wrong{background:#ffcdd2!important; border-color:red; color: #b71c1c;}
  
  #top{display:flex; justify-content:space-between; font-weight:bold; position:sticky; top:0; background:#fff8e1; padding:8px 0; z-index:10;}
  #barWrap{height:10px; background:#ddd; border-radius:5px; overflow:hidden; margin:5px 0 15px;}
  #bar{height:100%; background:#e65100; width:0%; transition:0.3s;}
  #nextBtn{width:100%; padding:14px; background:#e65100; color:white; border:none; border-radius:10px; font-size:18px; margin:15px 0; display:none; cursor: pointer;}
 </style>
</head>
<body>
   <h1>⚛️ Biology Special Quiz</h1>
   
   <div class="set-container">
        <p>আপনার পছন্দের কুইজ সেট সিলেক্ট করুন:</p>
        <div class="btn-group">
            <button id="btnSet1" class="set-btn active" onclick="changeSet(0)">সেট 1 (1-15)</button>
            <button id="btnSet2" class="set-btn" onclick="changeSet(1)">সেট 2 (16-30)</button>
            <button id="btnSet3" class="set-btn" onclick="changeSet(2)">সেট 3 (31-45)</button>
            <button id="btnSet4" class="set-btn" onclick="changeSet(3)">সেট 4 (46-60)</button>
            <button id="btnSet5" class="set-btn" onclick="changeSet(4)">সেট 5 (61-75)</button>
            <button id="btnSet6" class="set-btn" onclick="changeSet(5)">সেট 6 (76-90)</button>
            <button id="btnSet7" class="set-btn" onclick="changeSet(6)">সেট 7(91-105)</button>
          
            
        </div>
   </div>
   
   <div id="top"><span id="pageInfo"></span><span id="scoreInfo">Score: 0/0</span></div>
   <div id="barWrap"><div id="bar"></div></div>
   <div id="quiz"></div>
   <button id="nextBtn" onclick="nextSet()">পরের 15 টা ➡️</button>

   <script>
    // ১০০টি প্রশ্নের অ্যারে (এখানে নমুনা হিসেবে ৫টি আসল প্রশ্ন দেওয়া হলো, বাকিগুলো আপনি এই ফরম্যাটে যোগ করতে পারবেন)
    const allQuestions = [
   
            // সেট ১ (১-২৫)
          { q: "উদ্ভিদ কোশপ্রাচীরের প্রধান রাসায়নিক উপাদান কোনটি?", o: ["কাইটিন", "পেপটিডোগ্লাইকান", "সেলুলোজ", "গ্লাইকোপ্রোটিন"], a: 2 },
          { q: "কোন অঙ্গাণুকে কোশের 'পাওয়ার হাউস' বা শক্তিঘর বলা হয়?", o: ["রাইবোজোম", "লাইসোজোম", "গলগি বস্তু", "مাইটোকন্ড্রিয়া"], a: 3 },
          { q: "প্রোটিন ফ্যাক্টরি বা প্রোটিন সংশ্লেষণের প্রধান স্থান কোনটি?", o: ["রাইবোজোম", "সেন্ট্রোজোম", "লাইসোজোম", "প্লাস্টিд"], a: 0 },
          { q: "কোশঝিল্লির আধুনিক ও সর্বজনগ্রাহ্য 'ফ্লুইড মোজাইক মডেল' কে প্রস্তাব করেন?", o: ["ওয়াটসন ও ক্রিক", "সিঙ্গার ও নিকলসন", "রবার্ট হুক", "শ্লাইডন ও শোয়ান"], a: 1 },
          { q: "আদি কোশ বা প্রোক্যারিওটিক কোশে কোন ধরনের রাইবোজোম পাওয়া যায়?", o: ["50S", "70S", "80S", "60S"], a: 1 },
          { q: "শ্বেতসার বা স্টার্শ জাতীয় খাদ্য সঞ্চয়কারী প্লাস্টিডকে কী বলে?", o: ["ইলায়োপ্লাস্ট", "অ্যালিউরোনোপ্লাস্ট", "অ্যামাইলোপ্লাস্ট", "ক্রোমোপ্লাস্ট"], a: 2 },
          { q: "মিয়োসিস বিভাজনের কোন উপ-পর্যায়ে 'ক্রসিং ওভার' (Crossing over) ঘটে?", o: ["লেপ্টোটিন", "জাইগোটিন", "প্যাকাইটিন", "ডিপ্লোটিন"], a: 2 },
          { q: "সমসংস্থ (Homologous) ক্রোমোজোমের জোড় বাঁধার প্রক্রিয়াকে কী বলা হয়?", o: ["সিন্যাপসিস", "কায়াজমা", "বাইভ্যালেন্ট", "টার্মিনালাইজেশন"], a: 0 },
          { q: "অ্যানাফেজ ধাপে সেন্ট্রোমেয়ারের অবস্থানের ভিত্তিতে 'J' আকৃতির ক্রোমোজোমকে কী বলে?", o: ["মেটাসেন্ট্রিক", "সাব-মেটাসেন্ট্রিক", "অ্যাক্রোসেন্ট্রিক", "টেলোসেন্ট্রিক"], a: 2 },
          { q: "তামাকের মোজাইক ভাইরাস (TMV) এর গাঠনিক আকৃতি কেমন?", o: ["গোলাকার", "দণ্ডাকার", "ব্যাঙাচি আকার", "ঘনক্ষেত্রাকার"], a: 1 },
          { q: "ম্যালেরিয়া পরজীবীর (Plasmodium) কোন দশাটি মানুষের দেহে সংক্রামক?", o: ["মেরোজয়েট", "ট্রফোজয়েট", "স্পোরোজয়েট", "গ্যামেটোসাইট"], a: 2 },
          { q: "নিচের কোন উদ্ভিদটিকে 'জীবন্ত জীবাশ্ম' (Living fossil) বলা হয়?", o: ["Cycas", "Pinus", "Ginkgo biloba", "Cycas ও Ginkgo biloba দুটোরই"], a: 3 },
          { q: "মালভেসি (Malvaceae/জবা) গোত্রের উদ্ভিদের প্রধান বৈশিষ্ট্য কোনটি?", o: ["একগুচ্ছক পুংকেশর ও পরাগধানী বৃক্কাকার", "দ্বিগুণ পুংকেশর", "পরাগধানী সর্বমুখ", "লিগুলযুক্ত পাতা"], a: 0 },
          { q: "একবীজপত্রী উদ্ভিদের কাণ্ডের ভাস্কুলার বান্ডলের বিন্যাস কেমন হয়?", o: ["সমপার্শ্বীয় ও মুক্ত", "সমপার্শ্বীয় ও বদ্ধ", "সমদ্বিপার্শ্বীয়", "অরিয়"], a: 1 },
          { q: "উদ্ভিদের পত্ররন্ধ্র (Stomata) খোলা ও বন্ধ হওয়া প্রধানত কোন আয়ন দ্বারা নিয়ন্ত্রিত হয়?", o: ["Na+", "K+", "Ca2+", "Mg2+"], a: 1 },
          { q: "সবাত শ্বসনের প্রথম ধাপ অর্থাৎ গ্লাইকোলাইসিস (Glycolysis) কোশের কোথায় ঘটে?", o: ["মাইটোকন্ড্রিয়ার ম্যাট্রিক্সে", "সাইটোপ্লাজমে", "ক্লোরোপ্লাস্টে", "পেরক্সিজোমে"], a: 1 },
          { q: "জিন প্রকৌশলে (Genetic Engineering) 'আণবিক কাঁচি' (Molecular Scissors) বলা হয় কাকে?", o: ["DNA লাইগেজ", "রেস্ট্রিকশন এনজাইম", "পলিমারেজ", "হেলিকেজ"], a: 1 },
          { q: "ব্যাকটেরিয়া কোশের মূল ক্রোমোজোমের বাইরে অতিরিক্ত বৃত্তাকার DNA-কে কী বলে?", o: ["ক্যাপসিড", "প্লাস্টিড", "প্লাজমিড", "মিউসোম"], a: 2 },
          { q: "মানবদেহে কোন ধরনের প্রতিসাম্য (Symmetry) দেখা যায়?", o: ["অরিয় প্রতিসাম্য", "দ্বিপার্শ্বীয় প্রতিসাম্য", "গোলকীয় প্রতিসাম্য", "অপ্রতিসাম্য"], a: 1 },
          { q: "হাইড্রার সবচেয়ে বড় এবং বিষাক্ত নেমাটোসিস্টের নাম কী?", o: ["ভলভেন্ট", "স্টেরিওলিন গ্লুটিন্যান্ট", "পেনিট্র্যান্ট বা স্টেনোটিল", "স্ট্রেпотোলিন গ্লুটিন্যান্ট"], a: 2 },
          { q: "রুই মাছের হৃৎপিণ্ডকে কেন 'ভেনাস হার্ট' বা শিরা হৃৎপিণ্ড বলা হয়?", o: ["শুধু O2 যুক্ত রক্ত পরিবহন করে", "শুধু CO2 যুক্ত রক্ত পরিবহন করে", "চারটি প্রকোষ্ঠ থাকে", "কোনো সাইনাস ভেনোসাস থাকে না"], a: 1 },
          { q: "পাকস্থলীর প্যারাইটাল বা অক্সিন্টিক কোশ থেকে কোন অ্যাসিড নিঃসৃত হয়?", o: ["H2SO4", "HNO3", "HCl", "CH3COOH"], a: 2 },
          { q: "মানবদেহের কোন অঙ্গটিকে 'জৈব রসায়নাগার' (Biological Laboratory) বলা হয়?", o: ["হৃৎপিণ্ড", "ফুসফুস", "বৃক্কে", "যকৃৎ (Liver)"], a: 3 },
          { q: "লোহিত রক্তকণিকার (RBC) গড় আয়ুষ্কাল কত দিন?", o: ["১২ দিন", "১২০ দিন", "৪ দিন", "২০ দিন"], a: 1 },
          { q: "মানব হৃৎপিণ্ডের প্রধান প্রাকৃতিক পেসমেকার (Pacemaker) কোনটি?", o: ["AV নোড", "SA নোড", "পারকিনজি ফাইবার", "বান্ডল অব হিজ"], a: 1 },

          // সেট ২ (২৬-৫০ এর অংশ)
          { q: "কোন রক্তনালী ফুসফুস থেকে অক্সিজেনযুক্ত (O2) বিশুদ্ধ রক্ত বাম অলিন্দে নিয়ে আসে?", o: ["পালমোনারি ধমনী", "পালমোনারি শিরা", "কোরোনারি ধমনী", "মহাধমনী"], a: 1 },
          { q: "ফুসফুসের চারপাশ ঘিরে থাকা দ্বিস্তরী প্রতিরক্ষামূলক পর্দার নাম কী?", o: ["পেরিকার্ডিয়াম", "পেরিটোনিয়াম", "প্লুরা (Pleura)", "মেনিনজেস"], a: 2 },
          { q: "রক্তে পানির ভারসাম্য এবং মূত্রের ঘনত্ব নিয়ন্ত্রণকারী ADH হরমোন কোথা থেকে ক্ষরিত হয়?", o: ["পিটুইটারি গ্রন্থি", "থাইরয়েড গ্রন্থি", "অ্যাড্রেনাল গ্রন্থি", "অগ্ন্যাশয়"], a: 0 },
          { q: "مস্তিষ্কের কোন অংশটি দেহের ভারসাম্য এবং পেশির টান প্রধানত নিয়ন্ত্রণ করে?", o: ["সেরিব্রাম", "সেরিবেলাম", "মেডুলা অবলংগাটা", "থ্যালামাস"], a: 1 },
          { q: "রক্তের গ্লুকোজের মাত্রা কমাতে সাহায্যকারী ইনসুলিন হরমোন অগ্ন্যাশয়ের কোন কোশ থেকে ক্ষরিত হয়?", o: ["আলফা কোশ", "বিটা কোশ (Beta cell)", "ডেল্টা কোশ", "গামা কোশ"], a: 1 },
          { q: "কোশ বিভাজনের কোন দশায় নিউক্লিয়ার মেমব্রেন ও নিউক্লিওলাসের সম্পূর্ণ বিলুপ্তি ঘটে?", o: ["প্রফেজ", "প্রো-মেটাফেজ", "মেটাফেজ", "অ্যানাফেজ"], a: 2 },
          { q: "ব্যাকটেরিওফায (T2 Phage) ভাইরাসের জিনগত বস্তু বা নিউক্লিক অ্যাসিড কোনটি?", o: ["একসূত্রক RNA", "দ্বিসূত্রক RNA", "একসূত্রক DNA", "দ্বিসূত্রক DNA"], a: 3 },
          { q: "নিচের কোন রোগটি ভাইরাসের কারণে ঘটে না?", o: ["ডেঙ্গু", "জলাতঙ্ক", "টাইফয়েড", "হাম"], a: 2 },
          { q: "গ্রাম-পজিティブ ব্যাকটেরিয়া স্টেইনিং বা রঞ্জন প্রক্রিয়ায় কী রঙ ধারণ করে?", o: ["গোলাপি", "বেগুনি বা নীল", "লাল", "সবুজ"], a: 1 },
          { q: "ধানের বৈজ্ঞানিক নাম কোনটি এবং এটি কোন গোত্রের অন্তর্ভুক্ত?", o: ["Oryza sativa, Poaceae", "Triticum aestivum, Poaceae", "Solanum tuberosum, Solanaceae", "Hibiscus rosa-sinensis, Malvaceae"], a: 0 },

  ];

    let currentSet = 0, totalScore = 0, totalAnswered = 0;
    const perPage = 15;

    // সেট বাটনে ক্লিক করলে কাজ করার ফাংশন
    function changeSet(setNumber) {
        currentSet = setNumber;
        
        // সব বাটন থেকে active ক্লাস রিমুভ করে নির্দিষ্ট বাটনে অ্যাড করা
        let buttons = document.querySelectorAll('.set-btn');
        buttons.forEach((b, idx) => {
            if(idx === setNumber) b.classList.add('active');
            else b.classList.remove('active');
        });

        window.scrollTo(0, 0);
        loadSet();
    }

    // নির্দিষ্ট সেটের প্রশ্ন পর্দায় দেখানোর ফাংশন
    function loadSet() {
        const quizDiv = document.getElementById('quiz'); 
        quizDiv.innerHTML = '';
        document.getElementById('nextBtn').style.display = 'none';
      
        let start = currentSet * perPage; 
        let end = Math.min(start + perPage, allQuestions.length);
      
        // যদি ওই সেটে কোনো প্রশ্নই না থাকে
        if (start >= allQuestions.length) {
            quizDiv.innerHTML = `<div class='card' style='text-align:center; color:red;'>এই সেটে এখনও কোনো প্রশ্ন যোগ করা হয়নি!</div>`;
            document.getElementById('pageInfo').innerText = `Set ${currentSet + 1} (০-০ / ${allQuestions.length})`;
            return;
        }

        document.getElementById('pageInfo').innerText = `Set ${currentSet + 1} (${start + 1}-${end} / ${allQuestions.length})`;
      
        for (let i = start; i < end; i++) {
            const q = allQuestions[i]; 
            const card = document.createElement('div'); 
            card.className = 'card';
            card.innerHTML = `<b>${i + 1}. ${q.q}</b>`;
        
            q.o.forEach((opt, idx) => {
                const btn = document.createElement('button'); 
                btn.className = 'opt';
                btn.innerText = `${['A', 'B', 'C', 'D'][idx]}. ${opt}`;
          
                btn.onclick = () => {
                    if (card.dataset.done) return; 
                    card.dataset.done = 1;
            
                    if (idx === q.a) {
                        btn.classList.add('correct'); 
                        totalScore++;
                    } else {
                        btn.classList.add('wrong'); 
                        card.querySelectorAll('.opt')[q.a].classList.add('correct');
                    }
            
                    totalAnswered++; 
                    document.getElementById('scoreInfo').innerText = `Score: ${totalScore}/${totalAnswered}`;
                    
                    // প্রোগ্রেস বার আপডেট
                    document.getElementById('bar').style.width = (totalAnswered / allQuestions.length * 100) + '%';
            
                    // বর্তমান সেটের সবগুলো উত্তর দেওয়া শেষ হলে
                    if (document.querySelectorAll('.card[data-done]').length === (end - start)) {
                        let nextStart = (currentSet + 1) * perPage;
                        if (nextStart < allQuestions.length) {
                            document.getElementById('nextBtn').style.display = 'block';
                        } else {
                            document.getElementById('nextBtn').style.display = 'none';
                            quizDiv.innerHTML += `<div class='card' style='text-align:center; color:green; font-weight:bold;'>🎉 কুইজ সম্পূর্ণ হয়েছে! আপনার মোট স্কোর: ${totalScore}/${allQuestions.length} (${Math.round(totalScore/allQuestions.length*100)}%)</div>`;
                        }
                    }
                }; 
                card.appendChild(btn);
            }); 
            quizDiv.appendChild(card);
        }
    }

    // পরের সেটে যাওয়ার ফাংশন
    function nextSet() {
        currentSet++; 
        changeSet(currentSet);
    }

    // প্রথমবার পেজ লোড হওয়ার সময় কুইজ চালু করা
    loadSet();
  </script>

 // --- ২. বাংলায় বাটনের নাম সেট করার অবজেক্ট ---
 const catNames = { 
    all: "সব", 
    ph: "পদার্থবিজ্ঞান", 
    ch: "রসায়ন", 
    math: "গণিত", 
    bio: "জীববিজ্ঞান", 
    ict: "আইসিটি" 
 };
 const cats = ["all", "ph", "ch", "math", "bio", "ict"];
 let active = "all";

    // --- ৩. মেইন রেন্ডার ফাংশন ---
 function render(){
     // বাটন তৈরি
     let btns = document.getElementById("btns");
     btns.innerHTML = "";
     cats.forEach(c => {
         let b = document.createElement("button");
         b.innerText = catNames[c]; // এখানে সম্পূর্ণ বাংলা নাম দেখাবে
         if(c === active) b.className = "active";
         b.onclick = () => { active = c; render(); }; 
         btns.appendChild(b);
     });

      // প্রশ্ন ফিল্টার ও লিস্ট তৈরি
     let list = document.getElementById("list");
     list.innerHTML = "";
    
     let filtered = active === "all" ? allData : allData.filter(i => i.cat === active);
     document.getElementById("count").innerText = filtered.length + " টা প্রশ্ন";
    
     filtered.forEach(i => {
        let d = document.createElement("div");
        d.className = "card";
          // এখানে ব্যাকটিক (`) যোগ করে  আগের ভুলটি পুরোপুরি ঠিক করা হয়েছে
         d.innerHTML = `<b>Q: ${i.q}</b><div>Ans: ${i.a}</div><small>ব্যাখ্যা: ${i.exp}</small>`;
         list.appendChild(d);
       });
   }

     // অ্যাপ রান করা
   render();
  </script>

const container = document.getElementById('quote-container');
let lastIndex = -1;

// নতুন কার্ড তৈরি করার ফাংশন
function createQuoteCard() {
  let randomIndex;
  // পরপর একই উক্তি যাতে না আসে তার লজিক
  do {
    randomIndex = Math.floor(Math.random() * quotes.length);
  } while (randomIndex === lastIndex);
  
  lastIndex = randomIndex;
  const currentQuote = quotes[randomIndex];
  
  const card = document.createElement('div');
  card.className = 'quote-card';
  card.innerHTML = `
    <div class="quote-text">${currentQuote.t}</div>
    <div class="author-text">— ${currentQuote.a}</div>
  `;
  container.appendChild(card);
}

// প্রথমবার পেজ ওপেন হলে শুরুতেই ৩টি কার্ড লোড করে রাখা হবে
for(let i=0; i<3; i++) {
  createQuoteCard();
}

// স্ক্রল ট্র্যাকিং লজিক (ইউজার নিচে নামলেই নতুন কার্ড যোগ হবে)
window.onscroll = function() {
  // যদি ইউজার স্ক্রল করে পেজের একদম নিচের কাছাকাছি চলে আসে
  if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 150) {
    createQuoteCard(); // স্বয়ংক্রিয়ভাবে নতুন উক্তি যোগ হবে
  }
};
</script>
